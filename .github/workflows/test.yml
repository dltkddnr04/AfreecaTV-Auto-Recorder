name: CLI tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Streamlink
        shell: bash
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        shell: bash
        run: python -m compileall -q .
      - name: Run CLI tests
        shell: bash
        run: python -m unittest discover -s tests -v
      - name: Check Streamlink options
        shell: bash
        run: |
          streamlink --help > streamlink-help.txt
          for opt in --http-timeout --stream-timeout --stream-segment-timeout --stream-segment-attempts --retry-open --skip; do
            grep -Fq -- "$opt" streamlink-help.txt
          done
