name: CLI reliability tests
on:
  push:
  pull_request:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CLI dependency
        shell: bash
        run: python -m pip install -r requirements.txt
      - name: Compile CLI and helpers
        shell: bash
        run: python -m py_compile recorder_core.py main.py
      - name: Fault-injection and regression tests
        shell: bash
        run: python -m unittest discover -s tests -v
      - name: Check Streamlink CLI switches
        shell: bash
        run: |
          streamlink --help > streamlink-help.txt
          for flag in --http-timeout --stream-timeout --stream-segment-timeout --stream-segment-attempts --retry-streams --retry-max --retry-open --skip; do
            grep -Fq -- "$flag" streamlink-help.txt
          done
